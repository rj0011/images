name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make app icons
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          cd public
          rsvg-convert -w 192 icon.svg > pwa-192.png
          rsvg-convert -w 512 icon.svg > pwa-512.png
          rsvg-convert -w 180 icon.svg > apple-touch-icon.png
          rsvg-convert -w 64 icon.svg > favicon-64.png
          rsvg-convert -w 512 maskable.svg > maskable-512.png
      - run: npm install
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
